# Lychee link checker configuration
# https://lychee.cli.rs/configuration/

# Paths to exclude from checking
exclude_path = [
    "test_tmp",
    "benchmark",
    "__tests__",
    "CHANGELOG.md",
    "docs/superpowers",
    "docs/design",
    ".claude",
]

# Don't check mail addresses
include_mail = false

# Accept 429 (rate limiting) as valid
accept = [200, 429]

# Exclude URLs from checking (regex). npmjs.com returns 403 to automated link
# checkers due to bot protection; the package page is valid and is linked from
# the stability docs alongside crates.io and PyPI.
#
# GitHub returns 404 on /stargazers to non-browser clients, with or without a
# token; github.com/rust-lang/rust/stargazers behaves identically. The stars
# badge in README.md links there and resolves fine in a browser.
#
# Stack Overflow returns 403 to every automated client, browser user agent
# included, so the block is on the request rather than the page. The question
# linked from the MD047 docs is live and answered.
#
# The VS Code Marketplace answers automated clients with 404 (default user
# agent) or 503 (browser user agent) on every item page, our own and
# rust-lang.rust-analyzer alike, so the status says nothing about the link. The
# extension page linked from the README and docs is where the rumdl-vscode
# release job publishes, and it resolves fine in a browser.
exclude = [
    '^https://www\.npmjs\.com/',
    '^https://github\.com/.+/stargazers$',
    '^https://stackoverflow\.com/',
    '^https://marketplace\.visualstudio\.com/',
]

# Timeout per request in seconds
timeout = 30

# Maximum number of concurrent requests
max_concurrency = 16
