name: dependencies

# Weekly dependency refresh. `upd` rewrites the root and fuzz manifests and
# this job checks the result. The outcome is offered as a single
# rolling pull request rather than pushed to main.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies
  cancel-in-progress: false

env:
  # Pinned by digest as well as by version, so a replaced or re-tagged release
  # fails the checksum instead of running an unreviewed binary against this
  # repo. Bump both together.
  UPD_VERSION: v0.18.7
  UPD_SHA256: c95e061a33c2961974812243366931700436f3aadf40ff210eb63aeb4b4dbe8b
  UPD_BRANCH: deps/upd
  # The identity the proposal commits are made under. scripts/deps_branch.py
  # treats any commit on UPD_BRANCH by anyone else as hand-made.
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Decided before anything is applied: a commit someone pushed onto the
      # proposal branch by hand (say, a compile fix for an upgrade) must never
      # be force-pushed away or deleted with the branch.
      - name: Inspect the proposal branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/deps_branch.py --repo "${GITHUB_REPOSITORY}" --base main \
            --branch "${UPD_BRANCH}" --bot-email "${BOT_EMAIL}"

      - name: Leave a hand-edited proposal branch alone
        if: steps.branch.outputs.state == 'hand-edited'
        run: |
          msg="${UPD_BRANCH} carries commits not made by this workflow, so it is left as is. Merge or close its pull request and delete the branch to resume weekly proposals."
          echo "::warning::${msg}"
          echo "${msg}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install upd
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/upd.tar.gz \
            "https://github.com/rvben/upd/releases/download/${UPD_VERSION}/upd-${UPD_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UPD_SHA256}  /tmp/upd.tar.gz" | sha256sum -c -
          tar -xzf /tmp/upd.tar.gz -C /tmp
          sudo install -m 0755 /tmp/upd /usr/local/bin/upd
          upd --version

      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.14 # upd: github-releases jdx/mise
          experimental: true
          install: false

      # Prebuilt cargo-binstall so mise does not compile it from source
      # before it can binstall nextest; see the Test job in ci.yml.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install mise tools
        # What `make lint`, `make test-ci` and `make check-versions` run.
        run: ./scripts/mise-install.sh rust python uv "github:jdx/jactionlint" "cargo:cargo-binstall" "cargo:cargo-nextest"

      - name: Install Rust components
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      # Name both workspaces explicitly. `--lock` refreshes their lockfiles;
      # lint, tests and the fuzz compile check below cover the changed manifests.
      - name: Apply updates
        id: upd
        env:
          # Unauthenticated GitHub API calls hit HTTP 429, which upd reports as
          # errors rather than as up-to-date dependencies.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upd --apply --max-bump minor --min-age 7d --lock --no-color \
            --format text Cargo.toml fuzz/Cargo.toml 2>&1 | tee /tmp/upd.txt
          {
            echo "### Dependency updates"
            echo '```'
            cat /tmp/upd.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- Cargo.toml Cargo.lock fuzz/Cargo.toml fuzz/Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report incompatible dependency upgrades left for review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! upd --dry-run --only-bump major --min-age 7d --no-color \
            --format text Cargo.toml fuzz/Cargo.toml > /tmp/upd-major.txt 2>&1; then
            echo "::warning::The incompatible-upgrade report failed; see the step summary for details."
            echo "Report incomplete: upd returned an error." >> /tmp/upd-major.txt
          fi
          {
            echo "### Incompatible dependency upgrades (not applied)"
            echo "Review API changes and check the proposed MSRV against docs/stability.md."
            echo '```'
            cat /tmp/upd-major.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Reported, never applied. GITHUB_TOKEN is not allowed to push changes
      # under .github/workflows, and a mise toolchain bump changes what every
      # other job in this repo runs on, which is a decision rather than a
      # refresh.
      - name: Report action, hook and toolchain updates left for a human
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # `annotated` covers the mise version each workflow passes to
          # jdx/mise-action, carrying an annotation that names
          # `github-releases jdx/mise`. It is needed alongside `actions`, not
          # instead of it: `actions` selects a workflow's `uses:` refs and
          # nothing else, so each half reports lines the other leaves alone.
          # Spelling the marker itself here would make this comment an
          # annotation and put upd to work on the documentation.
          upd --dry-run --max-bump minor --min-age 7d --no-color \
            --format text -l actions,pre-commit,mise,annotated > /tmp/upd-actions.txt 2>&1 || true
          {
            echo "### Action, hook and toolchain updates (not applied)"
            echo '```'
            cat /tmp/upd-actions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Validate before proposing changes. GITHUB_TOKEN-created PRs do not
      # trigger PR workflows, so the proposal stays draft until a maintainer
      # marks it ready. ci.yml listens for that event to run required checks
      # before merging, with the branch protections still enforced.
      - name: Check version references in sync with Cargo.toml
        if: steps.upd.outputs.changed == 'true' && steps.branch.outputs.state != 'hand-edited'
        run: make check-versions

      - name: Run linting
        if: steps.upd.outputs.changed == 'true' && steps.branch.outputs.state != 'hand-edited'
        run: make lint

      - name: Run tests
        if: steps.upd.outputs.changed == 'true' && steps.branch.outputs.state != 'hand-edited'
        run: make test-ci

      - name: Check the declared minimum Rust version
        if: steps.upd.outputs.changed == 'true' && steps.branch.outputs.state != 'hand-edited'
        run: make msrv-check

      - name: Check fuzz targets
        if: steps.upd.outputs.changed == 'true' && steps.branch.outputs.state != 'hand-edited'
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins

      - name: Open or update the pull request
        if: steps.upd.outputs.changed == 'true' && steps.branch.outputs.state != 'hand-edited'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tip inspected above, empty when the branch did not exist.
          EXPECTED_TIP: ${{ steps.branch.outputs.sha }}
          # Named rather than inferred from the git remote, so `gh` never falls
          # back to the interactive prompt it cannot answer here.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "${BOT_EMAIL}"
          git switch -c "${UPD_BRANCH}"
          git add Cargo.toml Cargo.lock fuzz/Cargo.toml fuzz/Cargo.lock
          git commit -m "chore(deps): weekly dependency update"

          # Force-pushed so the branch stays a single rolling proposal rather
          # than accumulating a commit per week. The lease fails the push if
          # anything landed on the branch since it was inspected.
          git push --force-with-lease="refs/heads/${UPD_BRANCH}:${EXPECTED_TIP}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${UPD_BRANCH}"

          {
            echo "Weekly dependency refresh by [upd](https://github.com/rvben/upd) \`${UPD_VERSION}\`,"
            echo "capped at minor and skipping releases younger than 7 days."
            echo
            echo '```'
            cat /tmp/upd.txt
            echo '```'
            echo
            echo "### Checks"
            echo
            echo "\`make check-versions\`, \`make lint\`, \`make test-ci\`, \`make msrv-check\`"
            echo "and the fuzz compile check passed in the dependency-refresh job."
            echo
            echo "This proposal is a draft because GitHub does not trigger PR workflows"
            echo "for changes made with \`GITHUB_TOKEN\`. Mark it ready for review to"
            echo "run the required CI checks on this commit before reviewing or merging."
            echo "Each weekly refresh returns the proposal to draft for fresh validation."
            echo
            echo "### Incompatible upgrades (not applied)"
            echo
            echo "Review API changes and check the proposed MSRV against docs/stability.md."
            echo '```'
            cat /tmp/upd-major.txt
            echo '```'
            echo
            echo "### Actions, hooks and toolchains (not applied)"
            echo
            echo '```'
            cat /tmp/upd-actions.txt
            echo '```'
          } > /tmp/pr-body.md

          pr_number=$(gh pr list --head "${UPD_BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --body-file /tmp/pr-body.md
            if [ "$(gh pr view "$pr_number" --json isDraft --jq .isDraft)" != true ]; then
              gh pr ready "$pr_number" --undo
            fi
          elif ! gh pr create --draft --base main --head "${UPD_BRANCH}" \
            --title "chore(deps): weekly dependency update" \
            --body-file /tmp/pr-body.md; then
            echo "::error::Could not open the dependency PR. Check Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests."
            echo "The tested updates remain on ${UPD_BRANCH}; PR creation failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # main already carries every update within policy (typically because an
      # upgrade landed there by hand), so an open proposal from an earlier run
      # is stale. Close it and delete its branch rather than leave an outdated
      # diff open for review. A hand-edited branch is left for a maintainer.
      - name: Nothing to update
        if: steps.upd.outputs.changed != 'true' && steps.branch.outputs.state != 'hand-edited'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_TIP: ${{ steps.branch.outputs.sha }}
        run: |
          set -euo pipefail
          echo "No dependency updates within policy." >> "$GITHUB_STEP_SUMMARY"

          pr_number=$(gh pr list --head "${UPD_BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" \
              --comment "main already includes every dependency update within policy, so this proposal is out of date. The next refresh that finds updates opens a new one."
            echo "Closed the stale proposal #${pr_number}." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Deleted under the same lease as the force-push, so a commit pushed
          # since the inspection keeps the branch alive.
          if [ -n "${EXPECTED_TIP}" ]; then
            if git push --force-with-lease="refs/heads/${UPD_BRANCH}:${EXPECTED_TIP}" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              ":refs/heads/${UPD_BRANCH}"; then
              echo "Deleted ${UPD_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::${UPD_BRANCH} changed after it was inspected, so it was kept."
            fi
          fi
