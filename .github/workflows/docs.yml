name: Documentation

on:
  push:
    branches: [main]
    # Every input the build and its checks read: the sources (the
    # playground embeds the engine built from src/), the generator config,
    # the checker scripts and the Makefile targets that invoke them. A gap here does not fail the job, it skips it, so a
    # broken checker merges green.
    paths:
      - 'docs/**'
      - 'assets/benchmark.svg'
      - 'web/playground/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.mise.toml'
      - 'functions/**'
      - 'overrides/**'
      - 'zensical.toml'
      - 'scripts/docs_search_test.mjs'
      - 'scripts/docs_smoke_test.py'
      - 'scripts/docs_descriptions_test.py'
      - 'scripts/benchmark_docs_test.py'
      - 'scripts/generate_benchmark_chart.py'
      - 'scripts/docs_discoverability_test.py'
      - 'scripts/complete_docs_sitemap.py'
      - 'scripts/complete_docs_sitemap_test.py'
      - 'scripts/sanitize_docs_site.py'
      - 'scripts/sanitize_docs_site_test.py'
      - 'scripts/docs_analytics_test.mjs'
      - 'wrangler.toml'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/benchmark.svg'
      - 'web/playground/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.mise.toml'
      - 'functions/**'
      - 'overrides/**'
      - 'zensical.toml'
      - 'scripts/docs_search_test.mjs'
      - 'scripts/docs_smoke_test.py'
      - 'scripts/docs_descriptions_test.py'
      - 'scripts/benchmark_docs_test.py'
      - 'scripts/generate_benchmark_chart.py'
      - 'scripts/docs_discoverability_test.py'
      - 'scripts/complete_docs_sitemap.py'
      - 'scripts/complete_docs_sitemap_test.py'
      - 'scripts/sanitize_docs_site.py'
      - 'scripts/sanitize_docs_site_test.py'
      - 'scripts/docs_analytics_test.mjs'
      - 'wrangler.toml'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/playground/package-lock.json

      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.14 # upd: github-releases jdx/mise
          experimental: true
          install: false

      - name: Install Rust toolchain
        run: ./scripts/mise-install.sh rust

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-wasm
          save-if: false

      - name: Install Zensical
        run: pip install zensical

      - name: Build and check documentation site
        run: make docs-site

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-site
          path: |
            site/
            functions/
            wrangler.toml

  deploy:
    timeout-minutes: 15
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: docs-site
          path: .

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=main
