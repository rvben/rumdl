name: Documentation

on:
  push:
    branches: [main]
    # Every input the build and its two checks read: the sources, the
    # generator config, the checker scripts and the Makefile targets that
    # invoke them. A gap here does not fail the job, it skips it, so a
    # broken checker merges green.
    paths:
      - 'docs/**'
      - 'functions/**'
      - 'zensical.toml'
      - 'scripts/docs_smoke_test.py'
      - 'scripts/docs_descriptions_test.py'
      - 'scripts/docs_analytics_test.mjs'
      - 'scripts/docs_analytics_report.py'
      - 'wrangler.toml'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'functions/**'
      - 'zensical.toml'
      - 'scripts/docs_smoke_test.py'
      - 'scripts/docs_descriptions_test.py'
      - 'scripts/docs_analytics_test.mjs'
      - 'scripts/docs_analytics_report.py'
      - 'wrangler.toml'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Zensical
        run: pip install zensical

      - name: Build documentation
        run: zensical build --clean

      - name: Smoke-test built site
        run: make docs-smoke

      - name: Test privacy-preserving analytics endpoint
        run: make docs-analytics

      - name: Render analytics report fixture
        run: make docs-analytics-report

      - name: Check per-page descriptions
        run: make docs-descriptions

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-site
          path: |
            site/
            functions/
            wrangler.toml

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: docs-site
          path: .

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=main
