name: Test Action
on:
  push:
    branches: [main]
    paths: ["action.yml", "scripts/rumdl-action.sh", "__tests__/fixtures/**", ".github/workflows/test-action.yml"]
  pull_request:
    paths: ["action.yml", "scripts/rumdl-action.sh", "__tests__/fixtures/**", ".github/workflows/test-action.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-default:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        with:
          path: __tests__/fixtures/clean/

  test-pip-fallback:
    # A python-only container without curl cannot use the binary install path,
    # so this proves the pip fallback keeps such environments working.
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Assert curl is absent so the fallback is actually exercised
        shell: bash
        run: |
          if command -v curl; then
            echo "curl is unexpectedly present; this test would be vacuous"
            exit 1
          fi
      - uses: ./
        with:
          path: __tests__/fixtures/clean/

  test-with-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        with:
          version: "0.0.189"
          path: __tests__/fixtures/clean/

  test-with-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        with:
          config: __tests__/fixtures/clean/.rumdl.toml
          path: __tests__/fixtures/clean/

  test-annotations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        with:
          report-type: annotations
          path: __tests__/fixtures/clean/

  test-expected-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action (should fail on malformed markdown)
        id: should-fail
        continue-on-error: true
        uses: ./
        with:
          path: __tests__/fixtures/malformed/
      - name: Verify action failed
        run: |
          if [ "${{ steps.should-fail.outcome }}" == "success" ]; then
            echo "Expected failure but got success"
            exit 1
          fi

  test-informational-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action with fail-on-error=false (should succeed despite violations)
        uses: ./
        with:
          path: __tests__/fixtures/malformed/
          fail-on-error: "false"

  test-output-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action with output-file
        uses: ./
        with:
          path: __tests__/fixtures/clean/
          output-file: lint-results.txt
      - name: Verify output file was created
        run: |
          if [ ! -f lint-results.txt ]; then
            echo "Output file was not created"
            exit 1
          fi
          echo "Output file contents:"
          cat lint-results.txt

  test-output-file-with-violations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action with output-file on malformed markdown
        id: lint-malformed
        continue-on-error: true
        uses: ./
        with:
          path: __tests__/fixtures/malformed/
          output-file: violations.txt
      - name: Verify output file contains violations
        run: |
          if [ ! -f violations.txt ]; then
            echo "Output file was not created"
            exit 1
          fi
          if ! grep -q "MD" violations.txt; then
            echo "Output file should contain MD rule violations"
            cat violations.txt
            exit 1
          fi
          echo "Output file contains violations as expected:"
          cat violations.txt

  test-output-file-subdirectory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action with output-file in subdirectory
        uses: ./
        with:
          path: __tests__/fixtures/clean/
          output-file: results/subdir/lint-output.txt
      - name: Verify output file was created in subdirectory
        run: |
          if [ ! -f results/subdir/lint-output.txt ]; then
            echo "Output file was not created in subdirectory"
            exit 1
          fi
          echo "Output file created in subdirectory successfully"

  test-combined-informational-with-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action with both fail-on-error=false and output-file
        uses: ./
        with:
          path: __tests__/fixtures/malformed/
          fail-on-error: "false"
          output-file: informational-results.txt
      - name: Verify output file contains violations but action succeeded
        run: |
          if [ ! -f informational-results.txt ]; then
            echo "Output file was not created"
            exit 1
          fi
          if ! grep -q "MD" informational-results.txt; then
            echo "Output file should contain MD rule violations"
            exit 1
          fi
          echo "Combined mode works: violations captured, action succeeded"

  test-multiple-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action with multiple space-separated paths
        uses: ./
        with:
          path: "__tests__/fixtures/clean/test.md __tests__/fixtures/clean/test2.md"

  test-args:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action with extra CLI args
        id: with-args
        continue-on-error: true
        uses: ./
        with:
          path: __tests__/fixtures/malformed/
          args: "--extend-disable MD018"
      - name: Verify action ran with args (MD018 disabled, other rules still fire)
        run: |
          if [ "${{ steps.with-args.outcome }}" == "success" ]; then
            echo "Expected failure from remaining violations"
            exit 1
          fi
          echo "Action correctly applied extra args"

  test-fmt-check:
    # `check` also fails on this fixture, so failing is not evidence that
    # command was honoured. The diff header is: only `fmt --check` emits one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action with command=fmt-check on unformatted markdown
        id: fmt-check
        continue-on-error: true
        uses: ./
        with:
          command: fmt-check
          path: __tests__/fixtures/malformed/
          output-file: fmt-check-results.txt
      - name: Verify fmt --check reported a diff and rewrote nothing
        run: |
          if [ "${{ steps.fmt-check.outcome }}" == "success" ]; then
            echo "Expected failure from unformatted markdown"
            exit 1
          fi
          cat fmt-check-results.txt
          if ! grep -q '(fixed)' fmt-check-results.txt; then
            echo "Output has no diff header, so rumdl check ran instead of fmt --check"
            exit 1
          fi
          git diff --exit-code -- __tests__/fixtures/malformed/
          echo "Action correctly ran fmt --check without touching files"

  test-fmt-check-clean:
    # Formatted input must not fail the workflow, or fmt-check would be
    # unusable as a gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        with:
          command: fmt-check
          path: __tests__/fixtures/clean/

  test-fmt:
    # Runs on a copy so the assertion is about what the action wrote, not about
    # a fixture the repository would have to keep unformatted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Stage a copy of the unformatted fixture
        run: |
          mkdir -p fmt-workspace
          cp __tests__/fixtures/malformed/bad.md fmt-workspace/bad.md
      - name: Run action with command=fmt
        uses: ./
        with:
          command: fmt
          path: fmt-workspace/
      - name: Verify the file was rewritten
        run: |
          cat fmt-workspace/bad.md
          if diff -q __tests__/fixtures/malformed/bad.md fmt-workspace/bad.md; then
            echo "File is unchanged, so fmt did not run"
            exit 1
          fi
          if ! grep -q '^## No space after hash' fmt-workspace/bad.md; then
            echo "File changed but not in the way fmt fixes it"
            exit 1
          fi
          echo "Action correctly formatted the file in place"

  test-invalid-command:
    # Deliberately the CLEAN fixture: with the malformed one the job would go
    # green on a build that ignores command entirely, because the lint failure
    # alone satisfies the assertion below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action with invalid command value (should fail)
        id: should-fail
        continue-on-error: true
        uses: ./
        with:
          command: "lint"
          path: __tests__/fixtures/clean/
      - name: Verify action failed with validation error
        run: |
          if [ "${{ steps.should-fail.outcome }}" == "success" ]; then
            echo "Expected failure but got success"
            exit 1
          fi
          echo "Action correctly rejected invalid command value"

  test-invalid-fail-on-error:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action with invalid fail-on-error value (should fail)
        id: should-fail
        continue-on-error: true
        uses: ./
        with:
          path: __tests__/fixtures/clean/
          fail-on-error: "maybe"
      - name: Verify action failed with validation error
        run: |
          if [ "${{ steps.should-fail.outcome }}" == "success" ]; then
            echo "Expected failure but got success"
            exit 1
          fi
          echo "Action correctly rejected invalid fail-on-error value"

  test-install-only:
    # Lints `path` at a fixture that MUST fail, so the job goes red if
    # install-only ever stops skipping the lint.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install rumdl without linting
        id: install
        uses: ./
        with:
          install-only: "true"
          path: __tests__/fixtures/malformed/
      - name: Verify rumdl is callable by bare name in a later step
        shell: bash
        run: |
          installed="$(rumdl --version)"
          echo "$installed"
          if [ "$installed" != "rumdl ${{ steps.install.outputs.rumdl-version }}" ]; then
            echo "rumdl-version output '${{ steps.install.outputs.rumdl-version }}' does not match '$installed'"
            exit 1
          fi
          if [ -z "${{ steps.install.outputs.rumdl-path }}" ]; then
            echo "rumdl-path output is empty"
            exit 1
          fi
      - name: Verify the PATH entry resolves for the native Windows shell too
        if: runner.os == 'Windows'
        shell: pwsh
        run: rumdl --version

  test-path-export-default:
    # The PATH export is not conditional on install-only: a plain lint run must
    # leave rumdl callable as well.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        with:
          path: __tests__/fixtures/clean/
      - name: Verify rumdl is callable by bare name after a lint run
        run: rumdl --version

  test-install-only-pip-fallback:
    # pip puts rumdl on PATH by itself, so the malformed fixture is what makes
    # this job non-vacuous: it can only pass if the lint was skipped.
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Assert curl is absent so the fallback is actually exercised
        shell: bash
        run: |
          if command -v curl; then
            echo "curl is unexpectedly present; this test would be vacuous"
            exit 1
          fi
      - uses: ./
        with:
          install-only: "true"
          path: __tests__/fixtures/malformed/
      - name: Verify rumdl is callable by bare name in a later step
        shell: bash
        run: rumdl --version

  test-install-only-invalid:
    # Deliberately the CLEAN fixture: with the malformed one the job would go
    # green on a build that ignores install-only entirely, because the lint
    # failure alone satisfies the assertion below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run action with invalid install-only value (should fail)
        id: should-fail
        continue-on-error: true
        uses: ./
        with:
          install-only: "maybe"
          path: __tests__/fixtures/clean/
      - name: Verify action failed with validation error
        run: |
          if [ "${{ steps.should-fail.outcome }}" == "success" ]; then
            echo "Expected failure but got success"
            exit 1
          fi
          echo "Action correctly rejected invalid install-only value"

  all-tests-passed:
    runs-on: ubuntu-latest
    needs:
      - test-default
      - test-pip-fallback
      - test-with-version
      - test-with-config
      - test-annotations
      - test-expected-failure
      - test-informational-mode
      - test-output-file
      - test-output-file-with-violations
      - test-output-file-subdirectory
      - test-combined-informational-with-output
      - test-multiple-paths
      - test-args
      - test-fmt-check
      - test-fmt-check-clean
      - test-fmt
      - test-invalid-command
      - test-invalid-fail-on-error
      - test-install-only
      - test-path-export-default
      - test-install-only-pip-fallback
      - test-install-only-invalid
    if: always()
    steps:
      - name: All tests passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "Some tests failed or were cancelled"
            exit 1
          fi
          echo "All tests passed!"
