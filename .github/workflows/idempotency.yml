name: Idempotency

# Runs the formatter idempotency property tests at a high case count
# (PROPTEST_CASES=2000). This is too slow to gate every pull request, so it runs
# nightly and on demand. The regular `make test-ci` already runs the same tests
# at lower case counts on every push and pull request.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  idempotency:
    timeout-minutes: 60
    name: Formatter idempotency (high case count)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.14 # upd: github-releases jdx/mise
          experimental: true
          install: false

      # Bootstrap the prebuilt installer before mise installs cargo tools.
      # Compiling the latest cargo-binstall can require a newer Rust than ours.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install mise tools
        run: ./scripts/mise-install.sh rust "cargo:cargo-binstall" "cargo:cargo-nextest"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Run high-case-count idempotency property tests
        run: make test-idempotency

      - name: Check generated sentence layouts
        run: PROPTEST_CASES=2000 cargo nextest run --profile ci --test lib -E 'test(md013_sentence_layout_test)'
